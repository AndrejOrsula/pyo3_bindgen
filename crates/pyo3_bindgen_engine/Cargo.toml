[package]
name = "pyo3_bindgen_engine"
authors.workspace = true
categories.workspace = true
description = "Engine for automatic generation of Rust bindings to Python modules"
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
itertools = { workspace = true }
prettyplease = { workspace = true }
proc-macro2 = { workspace = true }
pyo3 = { workspace = true }
quote = { workspace = true }
rustc-hash = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
syn = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
typed-builder = { workspace = true }
unicode-normalization = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
indoc = { workspace = true }
jsonschema = { workspace = true }
tracing-subscriber = { workspace = true }

[build-dependencies]
pyo3-build-config = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[features]
default = []
numpy = []
num-complex = ["pyo3/num-complex"]
# Publication fault injection and lock instrumentation for this workspace's own tests.
# Never enable it for a published consumer: it exposes a way to fail a real publication.
internal-test-hooks = []

[[bench]]
name = "bindgen"
harness = false

[[bench]]
name = "scale"
harness = false

[lints]
workspace = true
