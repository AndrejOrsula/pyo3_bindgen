name: Rust

on:
  push:
    branches:
      - dev
      - main
      - ci/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

env:
  MSRV: "1.83"
  PYTHON_VERSION: "3.10"
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  rustfmt:
    if: ${{ github.repository != 'SpaceRL/pyo3_bindgen_private' || github.event.repository.private != true || github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ github.repository == 'SpaceRL/pyo3_bindgen_private' && github.event.repository.private == true && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "Linux", "X64"]') || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Documentation contract
        run: scripts/check-docs.sh
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          components: rustfmt
      - name: cargo fmt
        run: cargo fmt --all --check --verbose

  cargo:
    needs: rustfmt
    runs-on: ${{ github.repository == 'SpaceRL/pyo3_bindgen_private' && github.event.repository.private == true && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "Linux", "X64"]') || 'ubuntu-24.04' }}
    timeout-minutes: 60
    env:
      # The dogfood test normally skips when Gymnasium is absent. This lane makes
      # absence a hard failure and pins the package whose surface is inspected.
      PYO3_BINDGEN_REQUIRE_GYMNASIUM: "1"
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - MSRV
          - stable
          - beta
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        if: ${{ matrix.toolchain == 'MSRV' }}
        with:
          toolchain: ${{ env.MSRV }}
      - uses: ./.github/actions/setup-rust
        if: ${{ matrix.toolchain == 'stable' }}
        with:
          toolchain: stable
          components: clippy
      - uses: ./.github/actions/setup-rust
        if: ${{ matrix.toolchain == 'beta' }}
        with:
          toolchain: beta
      - uses: ./.github/actions/setup-embedded-python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          save-if: ${{ github.event_name == 'push' }}
      - name: Install pinned Python dogfood dependency
        run: python -m pip install "gymnasium==1.3.0"
      - name: cargo check (default features)
        run: cargo check --workspace --all-targets --locked --verbose
      - name: cargo check (all features)
        run: cargo check --workspace --all-targets --all-features --locked --verbose
      - name: cargo test (default features)
        run: cargo test --workspace --lib --bins --tests --examples --locked --verbose
      - name: cargo test (all features)
        run: cargo test --workspace --lib --bins --tests --examples --all-features --locked --verbose
      - name: cargo test --doc (default features)
        run: cargo test --workspace --doc --locked --verbose
      - name: cargo test --doc (all features)
        run: cargo test --workspace --doc --all-features --locked --verbose
      - name: stable | cargo clippy
        if: ${{ matrix.toolchain == 'stable' }}
        run: cargo clippy --workspace --all-targets --all-features --locked --no-deps --verbose -- --deny warnings
      - name: stable | Install cargo-hack
        if: ${{ matrix.toolchain == 'stable' }}
        uses: taiki-e/install-action@9458fed45835344deb5e69e06e831be047c96abf # cargo-hack
        with:
          tool: cargo-hack@0.6.45
      - name: stable | feature powerset
        if: ${{ matrix.toolchain == 'stable' }}
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo hack --workspace --exclude pyo3_bindgen_examples --feature-powerset --locked check --all-targets
      - name: stable | individual feature consumers
        if: ${{ matrix.toolchain == 'stable' }}
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          cargo test -p pyo3_bindgen_engine --test feature_bindings --features num-complex --locked --verbose
          cargo test -p pyo3_bindgen_engine --test feature_bindings --features numpy --locked --verbose
      - name: stable | cargo doc
        if: ${{ matrix.toolchain == 'stable' }}
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --all-features --locked --no-deps --document-private-items --verbose
      - name: stable | Install cargo llvm-cov
        if: ${{ matrix.toolchain == 'stable' }}
        uses: taiki-e/install-action@9458fed45835344deb5e69e06e831be047c96abf # cargo-llvm-cov
        with:
          tool: cargo-llvm-cov@0.8.6
      - name: stable | Generate coverage
        if: ${{ matrix.toolchain == 'stable' }}
        run: cargo llvm-cov --workspace --all-features --locked --lcov --output-path lcov.info
      - name: stable | Upload coverage (informational)
        if: ${{ matrix.toolchain == 'stable' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false

  platform-runtime:
    needs: rustfmt
    name: platform/runtime | ${{ matrix.label }}
    runs-on: ${{ github.repository == 'SpaceRL/pyo3_bindgen_private' && github.event.repository.private == true && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "Linux", "X64"]') || 'ubuntu-24.04' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows/macOS compile-only assurance is in the cross-check jobs below.
          # It does not replace their unavailable native runtime tests.
          - label: linux-free-threaded
            python: "3.14.0t"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
      - uses: ./.github/actions/setup-embedded-python
        with:
          python-version: ${{ matrix.python }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          save-if: ${{ github.event_name == 'push' }}
      - name: Verify selected interpreter
        run: python -VV
      - name: Native full workspace tests
        run: cargo test --workspace --lib --bins --tests --examples --all-features --locked --verbose

  compile-sweep:
    needs: rustfmt
    name: compile sweep (generate + compile real modules)
    runs-on: ${{ github.repository == 'SpaceRL/pyo3_bindgen_private' && github.event.repository.private == true && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "Linux", "X64"]') || 'ubuntu-24.04' }}
    timeout-minutes: 45
    env:
      # The heavy third-party targets normally skip when absent. This lane makes
      # absence a hard failure and pins the packages whose surface is inspected.
      PYO3_BINDGEN_REQUIRE_HEAVY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
      - uses: ./.github/actions/setup-embedded-python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          save-if: ${{ github.event_name == 'push' }}
      - name: Install pinned Python sweep dependencies
        run: >-
          python -m pip install
          "numpy==2.2.4" "pandas==2.3.3" "scipy==1.15.3"
          "PyYAML==6.0.2" "requests==2.32.3" "gymnasium==1.3.0"
      - name: Warm the shared sweep target directory
        env:
          # Deliberately outside the workspace `target/` so `rust-cache` neither saves
          # nor prunes the throwaway crates' artifacts. `runner` context is valid at
          # step scope, but not in job-level `env`.
          PYO3_BINDGEN_SWEEP_TARGET_DIR: ${{ runner.temp }}/sweep-target
        # The sweep spawns `cargo check` in throwaway crates that all share
        # PYO3_BINDGEN_SWEEP_TARGET_DIR. Building the pinned pyo3 once here keeps the
        # first batch from paying for it.
        run: |
          # Take the pyo3 pin from the workspace manifest (never hardcoded), matching what
          # build.rs exposes and the sweep crates consume, so the warmed pyo3 can never drift
          # from the one the batches build.
          pyo3_requirement="$(sed -n 's/^pyo3 = { version = "\([^"]*\)".*/\1/p' Cargo.toml | head -n1)"
          if [ -z "${pyo3_requirement}" ]; then echo "could not parse pyo3 pin from Cargo.toml" >&2; exit 1; fi
          mkdir -p "${PYO3_BINDGEN_SWEEP_TARGET_DIR}" "${RUNNER_TEMP}/sweep-warm/src"
          cd "${RUNNER_TEMP}/sweep-warm"
          printf '[package]\nname = "sweep_warm"\nversion = "0.0.0"\nedition = "2021"\npublish = false\n[workspace]\n[dependencies]\npyo3 = { version = "%s", default-features = false, features = ["py-clone"] }\n' "${pyo3_requirement}" > Cargo.toml
          : > src/lib.rs
          CARGO_TARGET_DIR="${PYO3_BINDGEN_SWEEP_TARGET_DIR}" cargo check --quiet
      - name: Compile sweep
        env:
          PYO3_BINDGEN_SWEEP_TARGET_DIR: ${{ runner.temp }}/sweep-target
        run: scripts/compile-sweep.sh --tier all --require-heavy

  native-platforms:
    needs: rustfmt
    name: native | Linux
    runs-on: ${{ github.repository == 'SpaceRL/pyo3_bindgen_private' && github.event.repository.private == true && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "Linux", "X64"]') || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
      - uses: ./.github/actions/setup-embedded-python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - name: Native workspace test
        run: cargo test --workspace --lib --bins --tests --examples --all-features --locked --verbose

  windows-msrv-cross-check:
    needs: rustfmt
    runs-on: ${{ github.repository == 'SpaceRL/pyo3_bindgen_private' && github.event.repository.private == true && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "Linux", "X64"]') || 'ubuntu-24.04' }}
    timeout-minutes: 30
    env:
      PYO3_CROSS: "1"
      PYO3_CROSS_PYTHON_VERSION: "3.10"
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.MSRV }}
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - name: Cross-check engine for Windows on MSRV
        run: >-
          cargo check -p pyo3_bindgen_engine --all-targets --all-features --locked --verbose
          --target x86_64-pc-windows-gnu
      - name: Cross-check facade for Windows on MSRV
        run: >-
          cargo check -p pyo3_bindgen --all-targets --features numpy,num-complex --locked --verbose
          --target x86_64-pc-windows-gnu
      - name: Cross-check CLI for Windows on MSRV
        run: >-
          cargo check -p pyo3_bindgen_cli --all-targets --all-features --locked --verbose
          --target x86_64-pc-windows-gnu

  windows-msvc-cross-check:
    needs: rustfmt
    name: compile only | Windows MSVC
    runs-on: ${{ github.repository == 'SpaceRL/pyo3_bindgen_private' && github.event.repository.private == true && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "Linux", "X64"]') || 'ubuntu-24.04' }}
    timeout-minutes: 30
    # This compiles Windows test bodies but cannot prove native Windows behavior.
    env:
      PYO3_CROSS: "1"
      PYO3_CROSS_PYTHON_VERSION: "3.10"
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - name: Cross-check engine (compile only)
        run: cargo check -p pyo3_bindgen_engine --all-targets --all-features --locked --verbose --target x86_64-pc-windows-msvc
      - name: Cross-check facade (compile only)
        run: cargo check -p pyo3_bindgen --all-targets --features numpy,num-complex --locked --verbose --target x86_64-pc-windows-msvc
      - name: Cross-check CLI (compile only)
        run: cargo check -p pyo3_bindgen_cli --all-targets --all-features --locked --verbose --target x86_64-pc-windows-msvc

  apple-cross-check:
    needs: rustfmt
    name: compile only | ${{ matrix.target }}
    runs-on: ${{ github.repository == 'SpaceRL/pyo3_bindgen_private' && github.event.repository.private == true && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "Linux", "X64"]') || 'ubuntu-24.04' }}
    timeout-minutes: 30
    # No Apple SDK, linking, or target runtime is involved in cargo check.
    # Native macOS filesystem/locking/durability evidence remains outstanding.
    env:
      PYO3_CROSS: "1"
      PYO3_CROSS_PYTHON_VERSION: "3.10"
      RUSTFLAGS: "-D warnings"
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - name: Cross-check engine (compile only)
        run: cargo check -p pyo3_bindgen_engine --all-targets --all-features --locked --verbose --target ${{ matrix.target }}
      - name: Cross-check facade (compile only)
        run: cargo check -p pyo3_bindgen --all-targets --features numpy,num-complex --locked --verbose --target ${{ matrix.target }}
      - name: Cross-check CLI (compile only)
        run: cargo check -p pyo3_bindgen_cli --all-targets --all-features --locked --verbose --target ${{ matrix.target }}

  python-compatibility:
    needs: rustfmt
    name: CPython | ${{ matrix.python }}
    runs-on: ${{ github.repository == 'SpaceRL/pyo3_bindgen_private' && github.event.repository.private == true && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "Linux", "X64"]') || 'ubuntu-24.04' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.8"
          - "3.14"
          - "3.14t"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
      - uses: ./.github/actions/setup-embedded-python
        with:
          python-version: ${{ matrix.python }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - name: Test interpreter boundary
        run: cargo test --workspace --lib --bins --tests --examples --all-features --locked --verbose

  abi3:
    needs: rustfmt
    runs-on: ${{ github.repository == 'SpaceRL/pyo3_bindgen_private' && github.event.repository.private == true && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "Linux", "X64"]') || 'ubuntu-24.04' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          components: clippy
      - uses: ./.github/actions/setup-embedded-python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - name: Test abi3-py310
        run: cargo test --workspace --lib --bins --tests --examples --features pyo3/abi3-py310 --locked --verbose
      - name: Lint abi3-py310
        run: cargo clippy --workspace --all-targets --features pyo3/abi3-py310 --locked --no-deps -- --deny warnings

  pypy-external-ir:
    needs: rustfmt
    runs-on: ${{ github.repository == 'SpaceRL/pyo3_bindgen_private' && github.event.repository.private == true && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "Linux", "X64"]') || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "pypy3.11"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - name: Compile supported PyPy surface
        run: |
          cargo check --locked --lib -p pyo3_bindgen_engine -p pyo3_bindgen -p pyo3_bindgen_macros
          cargo check --locked --bin pyo3_bindgen -p pyo3_bindgen_cli
      - name: Exercise Python-free external IR path
        run: |
          python_bin_dir="$(dirname "$(python -c 'import sys; print(sys.executable)')")"
          export LD_LIBRARY_PATH="${python_bin_dir}${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          cargo run --locked -p pyo3_bindgen_cli -- \
            --ir crates/pyo3_bindgen_cli/tests/fixtures/minimal_ir.json \
            --output pypy-bindings.rs

  graalpy-cross-check:
    needs: rustfmt
    runs-on: ${{ github.repository == 'SpaceRL/pyo3_bindgen_private' && github.event.repository.private == true && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "Linux", "X64"]') || 'ubuntu-24.04' }}
    timeout-minutes: 30
    env:
      PYO3_CROSS: "1"
      PYO3_CROSS_PYTHON_VERSION: "3.11"
      PYO3_CROSS_PYTHON_IMPLEMENTATION: "GraalVM"
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - name: Cross-check Python-free GraalPy surface
        run: |
          cargo check --locked --all-features --lib -p pyo3_bindgen_engine
          cargo check --locked --features numpy,num-complex --lib -p pyo3_bindgen
          cargo check --locked --all-features --bin pyo3_bindgen -p pyo3_bindgen_cli
          cargo check --locked -p pyo3_bindgen_macros

  dependency-policy:
    if: ${{ github.repository != 'SpaceRL/pyo3_bindgen_private' || github.event.repository.private != true || github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/cargo-deny.yml
    permissions:
      contents: read

  deny:
    name: deny
    if: ${{ always() && (github.repository != 'SpaceRL/pyo3_bindgen_private' || github.event.repository.private != true || github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: dependency-policy
    runs-on: ${{ github.repository == 'SpaceRL/pyo3_bindgen_private' && github.event.repository.private == true && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "Linux", "X64"]') || 'ubuntu-24.04' }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require dependency policy success
        env:
          DEPENDENCY_POLICY_RESULT: ${{ needs['dependency-policy'].result }}
        run: test "$DEPENDENCY_POLICY_RESULT" = success
